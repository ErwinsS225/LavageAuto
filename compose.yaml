# WashGuard — services locaux.
#
#   make db        démarre PostgreSQL (le reste se lance avec « make api »)
#   make db-stop   l'arrête
#   make db-reset  repart d'une base vide
#
# Les identifiants correspondent à la chaîne de connexion écrite par
# scripts/installer-station.sh :
#   postgresql://washguard:washguard@localhost:5432/washguard
#
# L'application elle-même n'est pas conteneurisée ici : sur une station, l'API
# et le front tournent en local (voir README, « Installation »). Ce fichier
# sert à fournir la base de données sans installer PostgreSQL à la main.
name: washguard

services:
  db:
    image: postgres:17-alpine
    container_name: washguard-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: washguard
      POSTGRES_PASSWORD: washguard
      POSTGRES_DB: washguard
      # Les sauvegardes et les exports manipulent des montants : l'UTF-8 et un
      # tri déterministe évitent les surprises d'ordre alphabétique en français.
      POSTGRES_INITDB_ARGS: "--encoding=UTF8 --locale=C"
    ports:
      - "5432:5432"
    volumes:
      - washguard-db:/var/lib/postgresql/data
    healthcheck:
      # installer-station.sh vérifie la disponibilité avec pg_isready -U washguard.
      test: ["CMD-SHELL", "pg_isready -U washguard -d washguard"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  washguard-db:
